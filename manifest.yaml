apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dorongrinstein/argo1.git
    path: .
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # Changed from '' to 'default' for safety
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
